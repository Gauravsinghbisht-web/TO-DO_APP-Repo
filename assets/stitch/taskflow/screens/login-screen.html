<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><title>TaskFlow</title><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "primary-container": "#675df9", "surface-bright": "#fcf8ff", "on-primary-container": "#fffbff", "surface-container-high": "#e9e5ff", "on-primary-fixed": "#100069", "on-secondary-container": "#fffbff", "tertiary-container": "#00855b", "outline": "#777587", "on-error-container": "#93000a", "on-tertiary-fixed": "#002113", "surface-container": "#efebff", "inverse-primary": "#c4c0ff", "surface-variant": "#e3dfff", "on-tertiary-fixed-variant": "#005236", "on-secondary-fixed": "#0f0069", "inverse-surface": "#2d2a5b", "secondary-fixed": "#e2dfff", "secondary-fixed-dim": "#c3c0ff", "outline-variant": "#c7c4d8", "primary-fixed-dim": "#c4c0ff", "on-secondary": "#ffffff", "surface": "#fcf8ff", "primary": "#4d41df", "surface-container-low": "#f6f2ff", "background": "#fcf8ff", "on-primary": "#ffffff", "surface-tint": "#4f44e2", "tertiary-fixed": "#6ffbbe", "on-surface-variant": "#464555", "surface-container-highest": "#e3dfff", "tertiary-fixed-dim": "#4edea3", "on-primary-fixed-variant": "#3622ca", "on-tertiary-container": "#f5fff6", "on-secondary-fixed-variant": "#3323cc", "on-tertiary": "#ffffff", "on-background": "#181445", "error": "#ba1a1a", "secondary-container": "#645efb", "error-container": "#ffdad6", "surface-container-lowest": "#ffffff", "tertiary": "#006947", "primary-fixed": "#e3dfff", "on-error": "#ffffff", "surface-dim": "#dad6ff", "on-surface": "#181445", "secondary": "#4b41e1", "inverse-on-surface": "#f3eeff" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "space-md": "1rem", "space-xs": "0.25rem", "gutter": "1rem", "space-lg": "1.5rem", "margin": "1rem", "space-sm": "0.5rem", "space-xl": "2rem" }, fontFamily: { "headline-lg": ["Inter"], "body-md": ["Inter"], "headline-lg-mobile": ["Inter"], "label-md": ["Inter"], "body-lg": ["Inter"], "headline-md": ["Inter"], "label-sm": ["Inter"], "label-lg": ["Inter"], "body-sm": ["Inter"], "display-lg": ["Inter"], "title-md": ["Inter"], "title-lg": ["Inter"] }, fontSize: { "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600" }], "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "400" }], "headline-lg-mobile": ["26px", { "lineHeight": "34px", "letterSpacing": "-0.02em", "fontWeight": "600" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.04em", "fontWeight": "500" }], "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "400" }], "headline-md": ["22px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "label-sm": ["10px", { "lineHeight": "14px", "letterSpacing": "0.06em", "fontWeight": "600" }], "label-lg": ["14px", { "lineHeight": "18px", "letterSpacing": "0.02em", "fontWeight": "600" }], "body-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "400" }], "display-lg": ["44px", { "lineHeight": "52px", "letterSpacing": "-0.03em", "fontWeight": "700" }], "title-md": ["16px", { "lineHeight": "22px", "letterSpacing": "0em", "fontWeight": "500" }], "title-lg": ["18px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600" }] } } } };</script><style>@layer base{html,body{width:100%;margin:0;padding:0;background-color:#fcf8ff;color:#181445;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}}::-webkit-scrollbar{display:none;}</style></head><body class="bg-surface font-body-md text-on-surface antialiased flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 bg-transparent"><div class="w-full flex items-center justify-between px-space-md pt-2 pb-1 text-on-surface"><span class="font-label-sm text-label-sm font-semibold tracking-wide">9:41</span><div class="flex items-center gap-1.5"><span class="material-symbols-outlined text-[15px]">signal_cellular_4_bar</span><span class="material-symbols-outlined text-[15px]">wifi</span><span class="material-symbols-outlined text-[15px]">battery_full</span></div></div></header><main class="flex-1 flex flex-col relative w-full pt-8 pb-safe bg-surface"><div class="flex flex-col w-full px-margin pb-space-lg select-none">
<!-- Brand Ambient Glow & Decorative Accent -->
<div class="relative w-full flex flex-col items-center pt-space-md pb-space-lg">
<div class="absolute -top-6 w-44 h-44 bg-primary/10 rounded-full blur-3xl pointer-events-none -z-10"></div>
<!-- Logo Container with Soft Levitation Shadow -->
<div class="relative flex items-center justify-center w-20 h-20 rounded-[24px] bg-primary shadow-xl shadow-primary/25 mb-space-md transition-transform duration-300 hover:scale-105 active:scale-95">
<img alt="TaskFlow Icon" class="w-14 h-14 object-contain rounded-2xl" src="https://lh3.googleusercontent.com/aida/ALJJyrDBLTcJLwN-PFDBmT8SgyY-h_I_TaMaKU-0yEYWoNBxkxyZ2SYHlsgnqriDWU643_lOCBDe7jipEujZPuAp_O4QIbts8WrDRDPCK_nPq5uRoPDxiZOA2Q_nRH2Y0YsQvRDKOiVkuaKbKfSV3vI1m8SDai0tPIrr6FOi0z2yIKSLaYp5MZgOiEzYwbKaUO2IyZ2mxT9Nq-DTQra0_Zk2IrLHz3hgVW6ZBybSsBSOVCyG"/>
<div class="absolute -bottom-1 -right-1 w-5 h-5 bg-tertiary-fixed rounded-full flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-on-tertiary-fixed text-[13px]" style="font-variation-settings: 'FILL' 1;">bolt</span>
</div>
</div>
<!-- Title and Subtitle -->
<div class="text-center px-space-xs">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface font-semibold tracking-tight">
        Welcome back!
      </h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1.5 max-w-[280px]">
        Log in to continue organizing your workflow with cognitive clarity.
      </p>
</div>
</div>
<!-- Sign In Form Card -->
<div class="w-full bg-surface-container-lowest rounded-2xl p-space-md shadow-sm">
<form class="flex flex-col gap-3.5" id="loginForm" onsubmit="event.preventDefault(); triggerAuth();">
<!-- Email Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface font-medium flex items-center justify-between" for="emailInput">
<span>Work Email</span>
<span class="font-label-sm text-label-sm text-outline opacity-80">Required</span>
</label>
<div class="group relative flex items-center bg-surface-container-low rounded-xl px-3.5 py-3 transition-all duration-200 focus-within:bg-surface-container-lowest focus-within:shadow-md focus-within:shadow-primary/10">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors text-[20px] mr-2.5">
            alternate_email
          </span>
<input class="w-full bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline-variant outline-none" id="emailInput" placeholder="alexa.chen@flow.design" required="" type="email" value="alexa.chen@flow.design"/>
<span class="material-symbols-outlined text-tertiary text-[18px] opacity-100 transition-opacity" id="emailValidBadge">
            check_circle
          </span>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface font-medium" for="passwordInput">
          Password
        </label>
<div class="group relative flex items-center bg-surface-container-low rounded-xl px-3.5 py-3 transition-all duration-200 focus-within:bg-surface-container-lowest focus-within:shadow-md focus-within:shadow-primary/10">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors text-[20px] mr-2.5">
            lock
          </span>
<input class="w-full bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline-variant outline-none tracking-wider" id="passwordInput" placeholder="••••••••••••" required="" type="password" value="FocusedWork2025!"/>
<button aria-label="Toggle password visibility" class="p-1 rounded-full text-outline hover:text-primary active:scale-90 transition-transform" id="togglePasswordBtn" type="button">
<span class="material-symbols-outlined text-[20px]" id="passwordEyeIcon">
              visibility
            </span>
</button>
</div>
</div>
<!-- Remember Me & Forgot Password Row -->
<div class="flex items-center justify-between pt-1 pb-1">
<label class="flex items-center gap-2 cursor-pointer group">
<input checked="" class="sr-only peer" id="rememberMe" type="checkbox"/>
<div class="w-5 h-5 rounded-md bg-surface-container-highest flex items-center justify-center peer-checked:bg-primary transition-colors shadow-xs">
<span class="material-symbols-outlined text-on-primary text-[15px] scale-0 peer-checked:scale-100 transition-transform font-bold">
              check
            </span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant group-hover:text-on-surface transition-colors">
            Remember me
          </span>
</label>
<a class="font-label-md text-label-md text-primary font-semibold hover:text-primary-container active:opacity-75 transition-colors" href="#forgot">
          Forgot password?
        </a>
</div>
<!-- Primary CTA Button -->
<button class="relative overflow-hidden w-full h-12 bg-primary text-on-primary rounded-full font-label-lg text-label-lg font-semibold shadow-md shadow-primary/30 active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-2 group" id="submitBtn" type="submit">
<span class="tracking-wide" id="btnText">Sign In</span>
<span class="material-symbols-outlined text-[20px] group-hover:translate-x-0.5 transition-transform" id="btnIcon">
          arrow_forward
        </span>
<div class="hidden w-5 h-5 border-2 border-on-primary/30 border-t-on-primary rounded-full animate-spin" id="btnSpinner"></div>
</button>
</form>
</div>
<!-- Divider Section -->
<div class="relative flex items-center justify-center my-space-lg">
<div class="w-full h-px bg-surface-container-highest"></div>
<span class="absolute px-3 bg-surface font-label-sm text-label-sm text-outline uppercase tracking-wider font-semibold">
      or continue with
    </span>
</div>
<!-- Google Sign-In Card Button -->
<button class="w-full h-12 bg-surface-container-lowest text-on-surface rounded-full font-label-lg text-label-lg font-medium shadow-xs hover:bg-surface-container-low active:scale-[0.98] transition-all flex items-center justify-center gap-3 px-4" onclick="handleGoogleAuth()" type="button">
<!-- Official Google SVG Multi-color glyph -->
<svg class="w-5 h-5 flex-shrink-0" viewbox="0 0 24 24">
<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.66v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.15z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z" fill="#34A853"></path>
<path d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.16 0 9.97 0 12s.45 3.84 1.25 5.42l4.03-3.15z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z" fill="#EA4335"></path>
</svg>
<span>Continue with Google</span>
</button>
<!-- Interactive Quick-Demo Switcher / Subtle Pill -->
<div class="flex items-center justify-center gap-1.5 mt-space-md py-1.5 px-3 bg-surface-container rounded-full mx-auto self-center">
<span class="w-2 h-2 rounded-full bg-tertiary animate-pulse"></span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Encrypted biometric ready</span>
</div>
<!-- Sign Up Footer -->
<div class="mt-space-lg text-center font-body-md text-body-md text-on-surface-variant">
<span>Don't have an account?</span>
<a class="font-label-lg text-label-lg text-primary font-semibold hover:underline ml-1" href="#signup">
      Create account
    </a>
</div>
</div>
<script>
  // Password Visibility Toggle
  const toggleBtn = document.getElementById('togglePasswordBtn');
  const passwordInput = document.getElementById('passwordInput');
  const eyeIcon = document.getElementById('passwordEyeIcon');
  
  if (toggleBtn && passwordInput && eyeIcon) {
    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
    });
  }

  // Interactive Feedback & Micro-animation on Sign In
  function triggerAuth() {
    const btnText = document.getElementById('btnText');
    const btnIcon = document.getElementById('btnIcon');
    const btnSpinner = document.getElementById('btnSpinner');
    const submitBtn = document.getElementById('submitBtn');

    if (!submitBtn) return;

    btnText.textContent = 'Authenticating...';
    btnIcon.classList.add('hidden');
    btnSpinner.classList.remove('hidden');
    submitBtn.classList.add('opacity-90', 'pointer-events-none');

    setTimeout(() => {
      btnSpinner.classList.add('hidden');
      btnIcon.classList.remove('hidden');
      btnIcon.textContent = 'done';
      btnText.textContent = 'Welcome Alexa!';
      submitBtn.classList.remove('bg-primary');
      submitBtn.classList.add('bg-tertiary', 'shadow-tertiary/20');
      
      setTimeout(() => {
        submitBtn.classList.remove('opacity-90', 'pointer-events-none', 'bg-tertiary');
        submitBtn.classList.add('bg-primary');
        btnIcon.textContent = 'arrow_forward';
        btnText.textContent = 'Sign In';
      }, 2000);
    }, 1100);
  }

  function handleGoogleAuth() {
    const feedback = document.createElement('div');
    feedback.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 bg-inverse-surface text-inverse-on-surface font-label-md text-label-md px-4 py-2.5 rounded-full shadow-lg flex items-center gap-2 z-50 transition-opacity duration-300';
    feedback.innerHTML = '<span class="material-symbols-outlined text-[18px] text-tertiary-fixed">verified_user</span> Connecting Google Workspace...';
    document.body.appendChild(feedback);
    
    setTimeout(() => {
      feedback.style.opacity = '0';
      setTimeout(() => feedback.remove(), 300);
    }, 1800);
  }
</script></main></body></html>
