abel-sm font-semibold tracking-wide">9:41</span><div class="flex items-center gap-1.5"><span class="material-symbols-outlined text-[15px]">signal_cellular_4_bar</span><span class="material-symbols-outlined text-[15px]">wifi</span><span class="material-symbols-outlined text-[15px]">battery_full</span></div></div></header><main class="flex-1 flex flex-col relative w-full pt-8 pb-safe bg-surface"><div class="flex flex-col w-full relative select-none overflow-hidden justify-between items-center px-gutter py-space-lg min-h-[calc(100vh-2rem)]">
<!-- Ambient background glow elements -->
<div class="absolute -top-24 -left-20 w-80 h-80 rounded-full bg-primary-fixed-dim/25 blur-3xl pointer-events-none"></div>
<div class="absolute -bottom-28 -right-20 w-88 h-88 rounded-full bg-secondary-fixed/30 blur-3xl pointer-events-none"></div>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 rounded-full bg-primary/10 blur-2xl pointer-events-none"></div>
<!-- Top status & subtle brand pill -->
<div class="w-full flex items-center justify-between z-10 pt-space-xs">
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container-high/80 text-primary backdrop-blur-md shadow-sm">
<span class="w-1.5 h-1.5 rounded-full bg-tertiary animate-pulse"></span>
<span class="font-label-sm text-label-sm font-semibold tracking-wider uppercase text-on-surface-variant">Ready to Flow</span>
</div>
<button class="flex items-center gap-0.5 px-3 py-1 rounded-full bg-surface-container-lowest/80 text-on-surface-variant hover:text-primary transition-all duration-300 font-label-md text-label-md active:scale-95 shadow-sm" id="skipBtn">
<span>Get Started</span>
<span class="material-symbols-outlined text-[16px]">arrow_forward</span>
</button>
</div>
<!-- Center brand & logo experience -->
<div class="w-full flex flex-col items-center justify-center my-auto z-10 text-center max-w-xs">
<!-- Logo with ambient elevation glow and tactile card framing -->
<div class="relative flex items-center justify-center mb-space-lg group">
<!-- Outer radiant glow rings -->
<div class="absolute -inset-4 rounded-[36px] bg-primary-container/20 blur-xl transition-all duration-700 animate-pulse"></div>
<div class="absolute -inset-1 rounded-[32px] bg-gradient-to-tr from-primary/30 to-secondary-fixed-dim/40 blur-sm"></div>
<!-- Icon Container -->
<div class="relative w-28 h-28 rounded-[28px] p-2.5 bg-surface-container-lowest shadow-xl flex items-center justify-center transition-transform duration-500 hover:scale-105 active:scale-95">
<img alt="TaskFlow App Icon" class="w-full h-full object-cover rounded-[22px] shadow-sm pointer-events-none" src="https://lh3.googleusercontent.com/aida/ALJJyrDBLTcJLwN-PFDBmT8SgyY-h_I_TaMaKU-0yEYWoNBxkxyZ2SYHlsgnqriDWU643_lOCBDe7jipEujZPuAp_O4QIbts8WrDRDPCK_nPq5uRoPDxiZOA2Q_nRH2Y0YsQvRDKOiVkuaKbKfSV3vI1m8SDai0tPIrr6FOi0z2yIKSLaYp5MZgOiEzYwbKaUO2IyZ2mxT9Nq-DTQra0_Zk2IrLHz3hgVW6ZBybSsBSOVCyG"/>
<!-- Micro celebration spark overlay -->
<div class="absolute -top-1.5 -right-1.5 w-6 h-6 rounded-full bg-surface-container-lowest shadow-md flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 1;">spark</span>
</div>
</div>
</div>
<!-- Typography -->
<div class="space-y-1.5 mb-space-lg">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold tracking-tight text-on-surface">
        Task<span class="text-primary">Flow</span>
</h1>
<p class="font-body-md text-body-md text-on-surface-variant font-medium tracking-wide">
        Organize. Focus. Flow.
      </p>
</div>
<!-- Animated Dual-Ring Minimal Spinner -->
<div class="relative w-11 h-11 flex items-center justify-center my-2">
<!-- Background track ring -->
<svg class="w-full h-full -rotate-90 transform" viewbox="0 0 44 44">
<circle class="text-surface-container-high" cx="22" cy="22" fill="none" r="18" stroke="currentColor" stroke-width="3"></circle>
<!-- Foreground active glowing ring -->
<circle class="text-primary animate-spin origin-center" cx="22" cy="22" fill="none" r="18" stroke="currentColor" stroke-dasharray="85" stroke-dashoffset="35" stroke-linecap="round" stroke-width="3" style="animation-duration: 1.25s;"></circle>
</svg>
<!-- Center pulsing nucleus -->
<div class="absolute w-2 h-2 rounded-full bg-primary-container animate-ping opacity-75"></div>
<div class="absolute w-1.5 h-1.5 rounded-full bg-primary"></div>
</div>
<!-- Status feedback -->
<div class="mt-space-sm font-label-md text-label-md text-on-surface-variant transition-opacity duration-300" id="statusMessage">
      Restoring workspace clarity...
    </div>
</div>
<!-- Bottom section: Navigation options & version branding -->
<div class="w-full flex flex-col items-center gap-space-md z-10 pb-space-xs max-w-sm">

<div class="w-full bg-surface-container-lowest/90 backdrop-blur-md rounded-2xl p-space-xs shadow-sm flex items-center justify-between gap-2">
<button class="flex-1 py-3 px-4 rounded-xl bg-primary text-on-primary font-label-lg text-label-lg shadow-md hover:bg-primary/95 active:scale-95 transition-all duration-200 flex items-center justify-center gap-2" id="btnOnboarding">
<span class="material-symbols-outlined text-[18px]">explore</span>
<span>Explore Tour</span>
</button>
<button class="flex-1 py-3 px-4 rounded-xl bg-surface-container text-primary font-label-lg text-label-lg hover:bg-surface-container-high active:scale-95 transition-all duration-200 flex items-center justify-center gap-2" id="btnLogin">
<span class="material-symbols-outlined text-[18px]">login</span>
<span>Sign In</span>
</button>
</div>
<!-- Meta Details & App Version -->
<div class="flex flex-col items-center gap-1 text-center">
<p class="font-label-sm text-label-sm text-on-surface-variant font-medium">
        Engineered for seamless productivity
      </p>
<div class="flex items-center gap-2">
<span class="w-1.5 h-1.5 rounded-full bg-secondary-container/60"></span>
<span class="font-label-sm text-label-sm text-outline tracking-wider font-semibold">VERSION 2.4.0 (BUILD 182)</span>
<span class="w-1.5 h-1.5 rounded-full bg-secondary-container/60"></span>
</div>
</div>
</div>
<!-- Toast Feedback Overlay for Splash Transitions -->
<div class="fixed bottom-24 left-1/2 -translate-x-1/2 opacity-0 pointer-events-none transition-all duration-300 transform translate-y-3 z-50" id="flowToast">
<div class="bg-inverse-surface text-inverse-on-surface px-4 py-2 rounded-full font-label-md text-label-md shadow-lg flex items-center gap-2">
<span class="material-symbols-outlined text-primary-fixed text-[18px]">verified</span>
<span id="toastText">Welcome back</span>
</div>
</div>
</div>
<script>
  (function() {
    const statusMsg = document.getElementById('statusMessage');
    const toast = document.getElementById('flowToast');
    const toastText = document.getElementById('toastText');
    const btnOnboarding = document.getElementById('btnOnboarding');
    const btnLogin = document.getElementById('btnLogin');
    const skipBtn = document.getElementById('skipBtn');

    const loadingStates = [
      "Restoring workspace clarity...",
      "Syncing offline routines...",
      "All systems in flow."
    ];

    let stateIdx = 0;
    const interval = setInterval(() => {
      stateIdx++;
      if (stateIdx < loadingStates.length) {
        statusMsg.style.opacity = '0';
        setTimeout(() => {
          statusMsg.textContent = loadingStates[stateIdx];
          statusMsg.style.opacity = '1';
        }, 180);
      } else {
        clearInterval(interval);
      }
    }, 1400);

    function triggerNav(message) {
      toastText.textContent = message;
      toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-3');
      toast.classList.add('opacity-100', 'translate-y-0');
      
      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-3');
      }, 2200);
    }

    if (btnOnboarding) {
      btnOnboarding.addEventListener('click', () => {
        triggerNav('Launching feature guide...');
      });
    }

    if (btnLogin) {
      btnLogin.addEventListener('click', () => {
        triggerNav('Redirecting to secure login...');
      });
    }

    if (skipBtn) {
      skipBtn.addEventListener('click', () => {
        triggerNav('Opening dashboard...');
      });
    }
  })();
</script></main></body></html>
